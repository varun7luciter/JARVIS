services:
  - type: web
    name: jarvis-backend
    runtime: python
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      python jarvis_backend/manage.py collectstatic --noinput
    startCommand: |
      gunicorn jarvis_backend.wsgi:application --bind 0.0.0.0:$PORT --chdir jarvis_backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOW_ALL_ORIGINS
        value: False
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-domain.onrender.com,http://localhost:5500,http://127.0.0.1:5500
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
